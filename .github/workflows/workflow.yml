name: cosmo-stats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter
        run: uv run pre-commit run --all-files
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
